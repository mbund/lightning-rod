name: Prepared dependencies
description: Restore the toolchains and runtime artifacts required by this job
inputs:
  zig:
    description: Restore Zig and its packages
    default: 'true'
  jdk:
    description: Restore the JDK
    default: 'false'
  registries:
    description: Restore generated Minecraft registries
    default: 'false'
  clients:
    description: Comma-separated client versions, or default for fixture API tests
    default: ''
  assets:
    description: Restore shared Minecraft assets
    default: 'false'
  native:
    description: Install the Minecraft client's native libraries
    default: 'false'
  previous:
    description: Restore the previous commit's server for the upgrade E2E
    default: 'false'
  world:
    description: Restore the chunk benchmark corpus
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      if: inputs.zig == 'true'
      with:
        name: ci-zig
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.zig == 'true'
      shell: bash
      run: |
        bundle="$RUNNER_TEMP/ci-dependencies"
        tar --zstd -xf "$bundle/toolchain.tar.zst" -C "$bundle"
        mkdir -p "$RUNNER_TEMP/ci-zig-cache"
        tar --zstd -xf "$bundle/zig.tar.zst" -C "$RUNNER_TEMP/ci-zig-cache"
        rm "$bundle/toolchain.tar.zst" "$bundle/zig.tar.zst"
        echo "$bundle/zig" >> "$GITHUB_PATH"
        echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/ci-zig-cache" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      if: inputs.jdk == 'true'
      with:
        name: ci-jdk
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.jdk == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ci-jdk"
        tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/jdk.tar.zst" -C "$RUNNER_TEMP/ci-jdk"
        rm "$RUNNER_TEMP/ci-dependencies/jdk.tar.zst"
        echo "$RUNNER_TEMP/ci-jdk/bin" >> "$GITHUB_PATH"
        echo "JAVA_HOME=$RUNNER_TEMP/ci-jdk" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      if: inputs.registries == 'true'
      with:
        name: ci-registries
        path: ${{ runner.temp }}/ci-registries
    - if: inputs.registries == 'true'
      shell: bash
      run: echo "LIGHTNING_ROD_REGISTRIES=$RUNNER_TEMP/ci-registries" >> "$GITHUB_ENV"
    - if: inputs.clients != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLIENTS: ${{ inputs.clients }}
      run: |
        if test "$CLIENTS" = default; then
          CLIENTS=$(sed -n 's/^minecraft_version=//p' e2e/client/gradle.properties)
        fi
        IFS=, read -r -a versions <<< "$CLIENTS"
        mkdir -p "$RUNNER_TEMP/ci-dependencies"
        for version in "${versions[@]}"; do
          gh run download "$GITHUB_RUN_ID" --name "ci-client-$version" --dir "$RUNNER_TEMP/ci-dependencies"
          mkdir -p "$RUNNER_TEMP/ci-clients/$version"
          tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/client-$version.tar.zst" -C "$RUNNER_TEMP/ci-clients/$version"
          rm "$RUNNER_TEMP/ci-dependencies/client-$version.tar.zst"
        done
        echo "LIGHTNING_ROD_E2E_CLIENTS=$RUNNER_TEMP/ci-clients" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      if: inputs.assets == 'true'
      with:
        name: ci-assets
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.assets == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ci-assets"
        tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/assets.tar.zst" -C "$RUNNER_TEMP/ci-assets"
        rm "$RUNNER_TEMP/ci-dependencies/assets.tar.zst"
        echo "LIGHTNING_ROD_E2E_ASSETS=$RUNNER_TEMP/ci-assets" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      if: inputs.native == 'true'
      with:
        name: ci-native
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.native == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ci-native"
        tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/native.tar.zst" -C "$RUNNER_TEMP/ci-native"
        sudo dpkg -i "$RUNNER_TEMP"/ci-native/*.deb
        rm -rf "$RUNNER_TEMP/ci-native" "$RUNNER_TEMP/ci-dependencies/native.tar.zst"
    - uses: actions/download-artifact@v8
      if: inputs.previous == 'true'
      with:
        name: ci-previous
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.previous == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ci-previous"
        tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/previous.tar.zst" -C "$RUNNER_TEMP/ci-previous"
        rm "$RUNNER_TEMP/ci-dependencies/previous.tar.zst"
        echo "LIGHTNING_ROD_E2E_PREVIOUS=$RUNNER_TEMP/ci-previous" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      if: inputs.world == 'true'
      with:
        name: ci-world
        path: ${{ runner.temp }}/ci-dependencies
    - if: inputs.world == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/benchmark-world"
        tar --zstd -xf "$RUNNER_TEMP/ci-dependencies/world.tar.zst" -C "$RUNNER_TEMP/benchmark-world"
        rm "$RUNNER_TEMP/ci-dependencies/world.tar.zst"
