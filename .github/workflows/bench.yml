name: Benchmarks

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  sections:
    name: Shared section visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - working-directory: vanilla
        run: |
          mkdir -p .zig-cache
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench-sections | tee .zig-cache/section-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: section-benchmark
          path: vanilla/.zig-cache/section-results.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  lighting:
    name: Lighting correctness and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          jdk: 'true'
          clients: 'baseline'
      - working-directory: bench/lighting
        run: |
          mkdir -p .zig-cache
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench | tee .zig-cache/results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighting-benchmark
          path: bench/lighting/.zig-cache/results.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  lighting-pipeline:
    name: Lighting streaming and update load
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - working-directory: vanilla
        run: |
          mkdir -p .zig-cache
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench-lighting | tee .zig-cache/lighting-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighting-pipeline-benchmark
          path: vanilla/.zig-cache/lighting-results.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  visibility:
    name: Visibility correctness and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - working-directory: bench/visibility
        run: |
          mkdir -p .zig-cache
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe test bench | tee .zig-cache/results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visibility-benchmark
          path: |
            bench/visibility/.zig-cache/results.txt
            bench/visibility/.zig-cache/visibility.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  prepare-world:
    name: Prepare chunk benchmark corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        id: corpus
        with:
          path: ${{ runner.temp }}/ci-dependencies/world.tar.zst
          key: ci-world-${{ hashFiles('game_data/baseline', 'bench/chunks/src/**', 'nbt/src/**', 'tools/world-import/src/**', 'chunks/src/**', 'records/src/**', 'storage/src/**', 'worlds/src/**') }}
      - uses: ./.github/actions/dependencies
        if: steps.corpus.outputs.cache-hit != 'true'
        with:
          jdk: 'true'
          registries: 'true'
      - name: Download gameplay baseline server
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          minecraft_baseline=$(cat game_data/baseline)
          curl --fail --silent --show-error --location \
            https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            -o "$RUNNER_TEMP/minecraft-versions.json"
          minecraft_metadata=$(jq -er --arg version "$minecraft_baseline" \
            '.versions[] | select(.id == $version) | .url' "$RUNNER_TEMP/minecraft-versions.json")
          curl --fail --silent --show-error --location "$minecraft_metadata" \
            -o "$RUNNER_TEMP/benchmark-version.json"
          server_url=$(jq -er '.downloads.server.url' "$RUNNER_TEMP/benchmark-version.json")
          server_sha1=$(jq -er '.downloads.server.sha1' "$RUNNER_TEMP/benchmark-version.json")
          curl --fail --silent --show-error --location \
            "$server_url" \
            -o "$RUNNER_TEMP/benchmark-minecraft.jar"
          printf '%s  %s\n' "$server_sha1" "$RUNNER_TEMP/benchmark-minecraft.jar" | sha1sum --check --status
          minecraft_data_version=$(unzip -p "$RUNNER_TEMP/benchmark-minecraft.jar" version.json | jq -er '.world_version')
          echo "MINECRAFT_DATA_VERSION=$minecraft_data_version" >> "$GITHUB_ENV"
      - name: Generate vanilla terrain corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        working-directory: bench/chunks
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe world -- \
            --server "$RUNNER_TEMP/benchmark-minecraft.jar" --output "$RUNNER_TEMP/benchmark-world" \
            --data-version "$MINECRAFT_DATA_VERSION"
      - name: Import visibility benchmark terrain
        if: steps.corpus.outputs.cache-hit != 'true'
        working-directory: tools/world-import
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe run -- \
            --input "$RUNNER_TEMP/benchmark-world/generator/world" \
            --output "$RUNNER_TEMP/benchmark-world/native" --no-lighting --skip-unsupported
      - name: Archive benchmark worlds
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          tar --zstd -cf "$RUNNER_TEMP/ci-dependencies/world.tar.zst" -C "$RUNNER_TEMP/benchmark-world" \
            corpus.bin corpus.json anvil registry.json native
      - uses: actions/upload-artifact@v7
        with:
          name: ci-world
          path: ${{ runner.temp }}/ci-dependencies/world.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  visibility-caves:
    name: Imported cave visibility correctness and quality
    needs: prepare-world
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
          world: 'true'
      - working-directory: bench/visibility
        run: |
          mkdir -p .zig-cache
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe test-caves caves -- \
            --world "$RUNNER_TEMP/benchmark-world/native/world" --position 256 64 256 \
            | tee .zig-cache/cave-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: imported-cave-visibility
          path: |
            bench/visibility/.zig-cache/cave-results.txt
            bench/visibility/.zig-cache/visibility-caves.jsonl
            ${{ runner.temp }}/benchmark-world/native/import.json
            ${{ runner.temp }}/benchmark-world/corpus.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  record-benchmark:
    name: Record storage comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - name: Compare record storage with SQLite under growth and churn
        working-directory: bench/records
        run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench
      - name: Preserve storage comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: record-storage-comparison
          path: bench/records/.zig-cache/storage-comparison/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  chunk-benchmark:
    name: Chunk ${{ matrix.benchmark }} benchmark
    needs: prepare-world
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        benchmark: [workloads, formats]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          world: 'true'
      - name: Run all chunk workloads
        if: matrix.benchmark == 'workloads'
        working-directory: bench/chunks
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench -- \
            --corpus "$RUNNER_TEMP/benchmark-world/corpus.bin"
      - name: Compare Anvil SQLite and native terrain storage
        if: matrix.benchmark == 'formats'
        working-directory: bench/chunks
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe compare -- \
            --corpus "$RUNNER_TEMP/benchmark-world/corpus.bin"
      - name: Preserve chunk benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chunk-${{ matrix.benchmark }}-benchmark
          path: |
            bench/chunks/.zig-cache/world-bench/results/results.json
            bench/chunks/.zig-cache/world-bench/results/*.jsonl
            bench/chunks/.zig-cache/storage-formats/results.json
            ${{ runner.temp }}/benchmark-world/corpus.json
            ${{ runner.temp }}/benchmark-world/generator/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  startup-benchmark:
    name: Startup and shutdown benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - name: Generate persisted server world
        working-directory: bench/startup-world
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe run -- \
            "$RUNNER_TEMP/benchmark-database/world"
      - name: Measure startup and shutdown
        working-directory: bench/startup
        env:
          WORLD: ${{ runner.temp }}/benchmark-database/world
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench -- \
            --world "$WORLD"
      - name: Preserve startup benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-benchmark
          path: |
            bench/startup/.zig-cache/startup-bench/results.json
            bench/startup/.zig-cache/startup-bench/server.log
            bench/startup/.zig-cache/startup-bench/metrics/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  tick-benchmark:
    name: Simulation tick scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - name: Measure steady-state tick workloads
        working-directory: bench/tick
        run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench -- --ticks=1000 --samples=3 | tee results.txt
      - name: Preserve tick benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tick-benchmark
          path: bench/tick/results.txt
          if-no-files-found: ignore
          retention-days: 7

  foundation-benchmark:
    name: Simulation framework overhead
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - name: Measure framework overhead
        working-directory: bench/tick
        run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe bench-foundation -- --ticks=1000000 | tee foundation-results.txt
      - name: Preserve framework benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-benchmark
          path: bench/tick/foundation-results.txt
          if-no-files-found: ignore
          retention-days: 7
