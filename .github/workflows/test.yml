name: Tests

on:
  workflow_call:

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          jdk: 'true'
          registries: 'true'
          clients: default
      - run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe test

  codegen:
    name: Generated cursor contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - working-directory: protocol_codegen
        run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build check

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, embedded, vanilla-plus, skyblock]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - working-directory: examples/${{ matrix.example }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe

  distribution:
    name: Package distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          registries: 'true'
      - run: bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig run test/distribution.zig

