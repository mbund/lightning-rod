name: Fuzz

on:
  workflow_call:

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [storage, records, chunks, lighting]
    env:
      TARGET: ${{ matrix.target }}
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - name: Check Debug fuzzer
        working-directory: fuzz
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build "$TARGET" --fuzz=1
          # Zig 0.16 can exit successfully after saving a fuzz crash.
          test ! -e "$ZIG_LOCAL_CACHE_DIR/f/crash"
      - name: Warm ReleaseSafe fuzzer
        working-directory: fuzz
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build --release=safe "$TARGET" --fuzz=1
          test ! -e "$ZIG_LOCAL_CACHE_DIR/f/crash"
      - name: Fuzz for 15 minutes
        working-directory: fuzz
        run: |
          status=0
          bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" timeout --signal=INT --kill-after=30s 900s zig build --release=safe "$TARGET" --fuzz || status=$?
          printf 'Fuzzer exit status: %s (124 means the 15-minute budget elapsed)\n' "$status"
          test "$status" -eq 124
          test ! -e "$ZIG_LOCAL_CACHE_DIR/f/crash"
      - name: Preserve fuzz failure input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-fuzz-crash
          path: .zig-cache/f/crash
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

