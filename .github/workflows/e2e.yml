name: E2E

on:
  workflow_call:
    inputs:
      upgrade:
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - id: tests
        shell: bash
        working-directory: e2e
        env:
          UPGRADE: ${{ inputs.upgrade }}
        run: |
          matrix=$(bash "$GITHUB_WORKSPACE/.github/scripts/offline.sh" zig build e2e-matrix)
          matrix=$(jq -c --argjson upgrade "$UPGRADE" '{include: [.include[] | select(.upgrade == $upgrade)] | group_by(.group) | map({group: .[0].group, tests: {include: sort_by(.priority)}}) | sort_by(.tests.include[0].priority)}' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ matrix.group }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/e2e-group.yml
    with:
      matrix: ${{ toJSON(matrix.tests) }}
