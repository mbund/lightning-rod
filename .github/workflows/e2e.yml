name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: bash .github/scripts/install-zig.sh
      - id: tests
        shell: bash
        working-directory: e2e
        run: |
          matrix=$(zig build e2e-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.scenario }}, ${{ matrix.version }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: bash .github/scripts/install-zig.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64
      - name: Real-client acceptance
        working-directory: e2e
        env:
          SCENARIO: ${{ matrix.scenario }}
          VERSION: ${{ matrix.version }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          zig build --release=safe e2e -Dscenario="$SCENARIO" -Dclient-version="$VERSION" -Dio=uring
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.scenario }}-${{ matrix.version }}
          path: |
            e2e/tests/*/artifacts/**/summary.json
            e2e/tests/*/artifacts/**/*.metrics.json
            e2e/tests/*/artifacts/**/*.result
            e2e/tests/*/artifacts/**/*.log
            e2e/tests/*/artifacts/**/*.jsonl
            e2e/tests/*/artifacts/**/screenshots/*.png
            e2e/tests/*/artifacts/**/*-failed-packet.*
          if-no-files-found: warn
          retention-days: 7
