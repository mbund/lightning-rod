name: E2E client

on:
  pull_request:
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: bash .github/scripts/install-zig.sh
      - name: Check generated cursor contracts
        working-directory: protocol_codegen
        run: zig build check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify independent package distribution
        run: timeout --kill-after=10s 300s python3 e2e/tests/protocol-extension/packages.py
      - id: tests
        shell: bash
        working-directory: e2e
        run: |
          matrix=$(zig build e2e-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  foundation:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: bash .github/scripts/install-zig.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native client and server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64
      - name: Real-client acceptance
        working-directory: e2e
        env:
          SCENARIO: ${{ matrix.scenario }}
          VERSION: ${{ matrix.version }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout --signal=INT --kill-after=10s 900s zig build -j2 --release=safe e2e -Dscenario="$SCENARIO" -Dclient-version="$VERSION" -Dio=uring
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.scenario }}-${{ matrix.version }}
          path: |
            e2e/artifacts/**/summary.json
            e2e/artifacts/**/*.metrics.json
            e2e/artifacts/**/*.result
            e2e/artifacts/**/*.log
            e2e/artifacts/**/*.jsonl
            e2e/artifacts/**/screenshots/*.png
            e2e/artifacts/**/*-failed-packet.*
          if-no-files-found: warn
          retention-days: 7
