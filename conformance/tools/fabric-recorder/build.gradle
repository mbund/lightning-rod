plugins { id 'fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
loom {
    splitEnvironmentSourceSets()
    mods { recorder { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs { client { runDir = System.getProperty("mcc.runDir", "run") } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(JavaExec).configureEach {
    ["mcc.output", "mcc.events", "mcc.artifacts", "mcc.peer", "mcc.server", "mcc.scenario", "mcc.expectedPeers", "mcc.targetChunks", "mcc.minimumRadius", "mcc.maximumStallTicks", "mcc.maximumStreamTicks", "mcc.minimumSoakTicks", "mcc.timeoutTicks", "mcc.connectTick", "mcc.captureBytes"].each {
        key -> if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    if (System.getProperty("mcc.peer") != null) args "--username", System.getProperty("mcc.peer")
}
