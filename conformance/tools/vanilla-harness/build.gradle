plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(JavaExec).configureEach {
    def socket = providers.gradleProperty("harnessSocket").orNull
    if (socket != null) systemProperty "mcc.harness.socket", socket
    def harnessUserDir = providers.gradleProperty("harnessRunDir").orNull
    if (harnessUserDir != null) systemProperty "user.dir", harnessUserDir
    doFirst {
        def harnessRunDir = providers.gradleProperty("harnessRunDir").orNull
        if (harnessRunDir != null) setWorkingDir(new File(harnessRunDir))
        file("${workingDir}/logs").mkdirs()
        println "Vanilla harness run directory: ${workingDir}"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
