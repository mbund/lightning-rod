plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}
def clientApi = providers.gradleProperty('client_api').getOrElse(
    new groovy.json.JsonSlurper().parse(file(System.getenv('LIGHTNING_ROD_E2E_CLIENT_SOURCE') ?: '.').toPath().resolve('versions.json').toFile())
        .find { it.release == minecraft_version }.api)
def unobfuscated = ['modern', 'current'].contains(clientApi)
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
version = project.mod_version
group = project.maven_group
def clientSource = file(System.getenv('LIGHTNING_ROD_E2E_CLIENT_SOURCE') ?: '.')
loom {
    enableModProvidedJavadoc = false
    splitEnvironmentSourceSets()
    mods { recorder { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs {
        client { runDir = System.getProperty("mcc.runDir", "run") }
    }
}
sourceSets.main.java.setSrcDirs([new File(clientSource, unobfuscated ? 'src/modern/java' : 'src/main/java')])
sourceSets.main.resources.setSrcDirs([new File(clientSource, 'src/main/resources')])
sourceSets.client.java.setSrcDirs([new File(clientSource, 'src/client/java')])
sourceSets.client.java.srcDir(new File(clientSource, ['current', 'modern', 'network'].contains(clientApi) ? "src/${clientApi}-game/java" : 'src/legacy-game/java'))
sourceSets.client.java.srcDir(new File(clientSource, clientApi == 'current' ? 'src/current-gui/java' : 'src/legacy-gui/java'))
sourceSets.client.java.srcDir(new File(clientSource, clientApi == 'legacy' ? 'src/legacy-input/java' : 'src/current-input/java'))
sourceSets.client.java.srcDir(new File(clientSource, ['legacy', 'input'].contains(clientApi) ? 'src/legacy-network/java' : 'src/current-network/java'))
sourceSets.client.java.srcDir(new File(clientSource, minecraft_version == '1.21.5' ? 'src/older-client/java' : 'src/newer-client/java'))
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${loader_version}")
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_version": project.minecraft_version }
}
tasks.withType(JavaCompile).configureEach { options.release = unobfuscated ? 25 : 21 }
def testsDirectory = file(System.getenv('LIGHTNING_ROD_E2E_TEST_ROOT') ?: new File(clientSource, '../tests'))
def generatedTests = layout.buildDirectory.dir('generated/e2e')
sourceSets.client.java.srcDir(testsDirectory)
sourceSets.client.java.exclude '**/.zig-cache/**', '**/zig-out/**', '**/zig-pkg/**'
sourceSets.client.java.srcDir(generatedTests)
sourceSets.client.resources.srcDir(testsDirectory)
sourceSets.client.resources.exclude '**/*.java', '**/*.zig', '**/build.zig.zon', '**/test.json', '**/.zig-cache/**', '**/zig-out/**', '**/zig-pkg/**'
def discoverTests = tasks.register('discoverTests') {
    inputs.files(fileTree(testsDirectory) { include '*/test.json' })
    outputs.dir(generatedTests)
    doLast {
        def names = new HashSet<String>()
        def cases = []
        fileTree(testsDirectory).matching { include '*/test.json' }.files.sort().each { manifest ->
            def test = new groovy.json.JsonSlurper().parse(manifest)
            if (!(test.client ==~ /[A-Za-z][A-Za-z0-9]*/)) throw new GradleException("Invalid test class: ${manifest}")
            test.variants.each { variant ->
                if (!(variant.name ==~ /[a-z][a-z0-9-]*/) || !names.add(variant.name)) throw new GradleException("Invalid or duplicate test: ${variant.name}")
                cases.add("case \"${variant.name}\" -> new ${test.client}(r);")
            }
        }
        def output = generatedTests.get().file('dev/lightningrod/e2e/DiscoveredTests.java').asFile
        output.parentFile.mkdirs()
        output.text = """package dev.lightningrod.e2e;
final class DiscoveredTests {
    static Fixture create(Recorder r, String name) {
        return switch (name) {
            ${cases.join('\n            ')}
            default -> throw new IllegalArgumentException("Unknown E2E test: " + name);
        };
    }
}
"""
    }
}
tasks.named('compileClientJava') { dependsOn discoverTests }
tasks.withType(JavaExec).configureEach {
    maxHeapSize = '1G'
    jvmArgs '-XX:ActiveProcessorCount=2'
    ["mcc.version", "mcc.events", "mcc.artifacts", "mcc.peer", "mcc.server", "mcc.scenario", "mcc.expectedPeers", "mcc.targetChunks", "mcc.minimumRadius", "mcc.maximumStallTicks", "mcc.maximumStreamTicks", "mcc.minimumSoakTicks", "mcc.timeoutTicks", "mcc.connectTick"].each {
        key -> if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    if (System.getProperty("mcc.peer") != null) args "--username", System.getProperty("mcc.peer")
}
