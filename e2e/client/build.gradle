plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}
def clientApi = providers.gradleProperty('client_api').getOrElse(
    new groovy.json.JsonSlurper().parse(file(System.getenv('LIGHTNING_ROD_E2E_CLIENT_SOURCE') ?: '.').toPath().resolve('versions.json').toFile())
        .find { it.release == minecraft_version }.api)
def unobfuscated = ['modern', 'current'].contains(clientApi)
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
version = project.mod_version
group = project.maven_group
def clientSource = file(System.getenv('LIGHTNING_ROD_E2E_CLIENT_SOURCE') ?: '.')
loom {
    enableModProvidedJavadoc = false
    splitEnvironmentSourceSets()
    mods { recorder { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs {
        client { runDir = System.getProperty("mcc.runDir", "run") }
    }
}
sourceSets.main.java.setSrcDirs([new File(clientSource, unobfuscated ? 'src/modern/java' : 'src/main/java')])
sourceSets.main.resources.setSrcDirs([new File(clientSource, 'src/main/resources')])
sourceSets.client.java.setSrcDirs([new File(clientSource, 'src/client/java')])
sourceSets.client.java.srcDir(new File(clientSource, ['current', 'modern', 'network'].contains(clientApi) ? "src/${clientApi}-game/java" : 'src/legacy-game/java'))
sourceSets.client.java.srcDir(new File(clientSource, clientApi == 'current' ? 'src/current-gui/java' : 'src/legacy-gui/java'))
sourceSets.client.java.srcDir(new File(clientSource, clientApi == 'legacy' ? 'src/legacy-input/java' : 'src/current-input/java'))
sourceSets.client.java.srcDir(new File(clientSource, ['legacy', 'input'].contains(clientApi) ? 'src/legacy-book/java' : 'src/current-book/java'))
sourceSets.client.java.srcDir(new File(clientSource, ['legacy', 'input'].contains(clientApi) ? 'src/legacy-network/java' : 'src/current-network/java'))
sourceSets.client.java.srcDir(new File(clientSource, unobfuscated ? 'src/modern-payload/java' : 'src/legacy-payload/java'))
sourceSets.client.java.srcDir(new File(clientSource, minecraft_version == '1.21.5' ? 'src/legacy-terrain/java' : ['legacy', 'input'].contains(clientApi) ? 'src/mesh-terrain/java' : 'src/fading-terrain/java'))
sourceSets.client.java.srcDir(new File(clientSource, minecraft_version == '1.21.5' ? 'src/older-client/java' : 'src/newer-client/java'))
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${loader_version}")
    add(unobfuscated ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_version": project.minecraft_version }
}
tasks.withType(JavaCompile).configureEach { options.release = unobfuscated ? 25 : 21 }
def testsDirectory = file(System.getenv('LIGHTNING_ROD_E2E_TEST_ROOT') ?: new File(clientSource, '../tests'))
def testManifests = fileTree(testsDirectory).matching { include '*/test.json' }.files.sort()
def generatedTests = layout.buildDirectory.dir('generated/e2e')
// Keep fixtures with their scenarios while giving each one a package-correct
// source root that both javac and JDT LS can import.
sourceSets.client.java.srcDirs(testManifests.collect { new File(it.parentFile, 'client') })
sourceSets.client.java.exclude '**/.zig-cache/**', '**/zig-out/**', '**/zig-pkg/**'
sourceSets.client.java.srcDir(generatedTests)
sourceSets.test.java.setSrcDirs([new File(clientSource, 'src/test/java')])
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
sourceSets.client.resources.srcDir(testsDirectory)
sourceSets.client.resources.exclude '**/*.java', '**/*.zig', '**/build.zig.zon', '**/test.json', '**/.zig-cache/**', '**/zig-out/**', '**/zig-pkg/**', '**/artifacts/**'
def discoverTests = tasks.register('discoverTests') {
    inputs.files(fileTree(testsDirectory) { include '*/test.json' })
    outputs.dir(generatedTests)
    doLast {
        def names = new HashSet<String>()
        def cases = []
        fileTree(testsDirectory).matching { include '*/test.json' }.files.sort().each { manifest ->
            def test = new groovy.json.JsonSlurper().parse(manifest)
            if (!(test.client ==~ /[A-Za-z][A-Za-z0-9]*/)) throw new GradleException("Invalid test class: ${manifest}")
            test.variants.each { variant ->
                if (!(variant.name ==~ /[a-z][a-z0-9-]*/) || !names.add(variant.name)) throw new GradleException("Invalid or duplicate test: ${variant.name}")
                cases.add("case \"${variant.name}\" -> new ${test.client}(r);")
            }
        }
        def output = generatedTests.get().file('dev/lightningrod/e2e/DiscoveredTests.java').asFile
        output.parentFile.mkdirs()
        output.text = """package dev.lightningrod.e2e;
final class DiscoveredTests {
    static Fixture create(Recorder r, String name) {
        return switch (name) {
            ${cases.join('\n            ')}
            default -> throw new IllegalArgumentException("Unknown E2E test: " + name);
        };
    }
}
"""
    }
}
tasks.named('compileClientJava') { dependsOn discoverTests }
// Buildship/JDT LS must generate the fixture factory on the first IDE import,
// before the editor compiles Fixture.java or any test source.
eclipse.synchronizationTasks(discoverTests)
tasks.named('eclipseClasspath') { dependsOn discoverTests }
tasks.withType(JavaExec).configureEach {
    maxHeapSize = '1G'
    jvmArgs '-XX:ActiveProcessorCount=2'
    ["mcc.version", "mcc.events", "mcc.artifacts", "mcc.peer", "mcc.server", "mcc.scenario", "mcc.expectedPeers", "mcc.targetChunks", "mcc.minimumRadius", "mcc.minimumSoakTicks", "mcc.timeoutTicks", "mcc.connectTick"].each {
        key -> if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    if (System.getProperty("mcc.peer") != null) args "--username", System.getProperty("mcc.peer")
}

tasks.register('testFixtureApi', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lightningrod.e2e.FixtureApiTest'
}

tasks.register('exportRuntime') {
    dependsOn tasks.named('testClasses'), tasks.named('configureLaunch')
    inputs.files(sourceSets.client.runtimeClasspath, sourceSets.test.runtimeClasspath)
    inputs.property 'minecraft_version', minecraft_version
    def destination = providers.gradleProperty('runtimeOutput').map { file(it) }
        .orElse(layout.buildDirectory.dir('runtime').map { it.asFile })
    outputs.dir(destination)
    doLast {
        def output = destination.get()
        delete(output)
        output.mkdirs()
        def run = tasks.named('runClient').get()
        def replacements = new LinkedHashMap<String, String>()
        def included = new LinkedHashMap<File, String>()
        def include = { File source ->
            if (!included.containsKey(source)) {
                def target = "classpath/${included.size()}/${source.name}"
                included[source] = target
                replacements[source.absolutePath] = '@ROOT@/' + target
                if (source.isDirectory()) copy { from source; into new File(output, target) }
                else if (source.isFile()) copy { from source; into new File(output, target).parentFile }
                else new File(output, target).mkdirs()
            }
            included[source]
        }
        def classpath = run.classpath.files.collect { include(it) }
        def testClasspath = sourceSets.test.runtimeClasspath.files.collect { include(it) }
        def configs = new File(projectDir, '.gradle/loom-cache')
        def templates = []
        ['launch.cfg', 'remapClasspath.txt', 'log4j.xml'].each { name ->
            def source = new File(configs, name)
            if (source.exists() && (name == 'launch.cfg' || new File(configs, 'launch.cfg').text.contains(source.absolutePath))) {
                replacements[source.absolutePath] = '@RUN@/' + name
                templates.add([name: name, contents: source.text])
            }
        }
        replacements[new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets').absolutePath] = '@ASSETS@'
        templates.each { template ->
            def paths = template.name == 'remapClasspath.txt' ? [template.contents] :
                template.name == 'launch.cfg' ? template.contents.readLines().findAll { it.contains('=') }.collect { it.split('=', 2)[1] } : []
            paths.each { value ->
                value.split(File.pathSeparator).each { path ->
                    def source = new File(path)
                    if (source.isAbsolute() && source.exists() && !replacements.containsKey(source.absolutePath)) include(source)
                }
            }
        }
        def relocate = { String value ->
            replacements.entrySet().sort { -it.key.length() }.each { value = value.replace(it.key, it.value) }
            value
        }
        templates.each { it.contents = relocate(it.contents) }
        templates.each {
            if (it.contents.contains(projectDir.absolutePath) || it.contents.contains(gradle.gradleUserHomeDir.absolutePath))
                throw new GradleException("Unbundled runtime path in ${it.name}")
        }
        // Loom's argument file supplies the classpath that the bundle passes explicitly.
        def jvm = run.allJvmArgs.findAll { !it.startsWith('@') }.collect { relocate(it) }
        def args = (run.args + run.argumentProviders.collectMany { it.asArguments() }).collect { relocate(it) }
        new File(output, 'runtime.json').text = groovy.json.JsonOutput.toJson([
            version: minecraft_version, main: run.mainClass.get(), jvm: jvm, args: args,
            classpath: classpath, test_classpath: testClasspath, templates: templates,
        ])
        println "Client runtime ${minecraft_version}: ${included.size()} classpath entries"
    }
}

tasks.register('exportAssets', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lightningrod.e2e.PrepareAssets'
    args new File(clientSource, 'versions.json').absolutePath,
        providers.gradleProperty('assetOutput').getOrElse(layout.buildDirectory.dir('assets').get().asFile.absolutePath)
}
