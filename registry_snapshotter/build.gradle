plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def versions = new groovy.json.JsonSlurper().parse(file('versions.json'))
def minecraftVersion = providers.gradleProperty('minecraft_version').getOrElse(versions.last().release)
def release = versions.find { it.release == minecraftVersion }
def api = providers.gradleProperty('registry_api').getOrElse(release == null ? 'current' : release.api)
if (!['legacy', 'input', 'network', 'modern', 'current'].contains(api)) throw new GradleException("Unsupported registry API: ${api}")
def modern = ['modern', 'current'].contains(api)
apply plugin: modern ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

version = project.mod_version
group = project.maven_group
layout.buildDirectory = file(providers.gradleProperty('buildRoot').getOrElse('build'))

loom {
    enableModProvidedJavadoc = false
    runs {
        registrySnapshot {
            server()
            runDir = layout.buildDirectory.dir('snapshot-run').get().asFile.absolutePath
            // IDE imports configure runs without invoking the snapshot task.
            property 'mcc.snapshotOutput', providers.gradleProperty('snapshotOutput').getOrElse(
                layout.buildDirectory.file('snapshot.json').get().asFile.absolutePath)
            property 'mcc.minecraftVersion', minecraftVersion
            property 'mcc.fuelOutput', providers.gradleProperty('fuelOutput').getOrElse(
                layout.buildDirectory.file('fuels.bin').get().asFile.absolutePath)
            property 'mcc.physicsOutput', providers.gradleProperty('physicsOutput').getOrElse(
                layout.buildDirectory.file('physics.bin').get().asFile.absolutePath)
            property 'mcc.packOutput', providers.gradleProperty('packOutput').getOrElse(
                layout.buildDirectory.file('pack.bin').get().asFile.absolutePath)
        }
    }
}

sourceSets.main.java.srcDir(modern ? 'src/modern-loader/java' : 'src/legacy-loader/java')
sourceSets.main.java.srcDir(['legacy', 'input'].contains(api) ? 'src/legacy-registry/java' : 'src/current-registry/java')
sourceSets.main.java.srcDir(modern ? 'src/current-lighting/java' : 'src/legacy-lighting/java')
sourceSets.main.java.srcDir(modern ? 'src/current-physics/java' : 'src/legacy-physics/java')
sourceSets.main.java.srcDir(modern ? 'src/current-fuel/java' : 'src/legacy-fuel/java')

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (!modern) mappings loom.officialMojangMappings()
    add(modern ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:${loader_version}")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'minecraft_version': minecraftVersion }
}

tasks.withType(JavaCompile).configureEach { options.release = modern ? 25 : 21 }
tasks.register('registrySnapshot') { dependsOn 'runRegistrySnapshot' }

tasks.register('lightingSnapshot', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.lightningrod.registry.LightingSnapshot'
    args providers.gradleProperty('lightingOutput').getOrElse(
        layout.buildDirectory.file('lighting.bin').get().asFile.absolutePath)
}
